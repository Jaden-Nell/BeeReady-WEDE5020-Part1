<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeReady | Enquiry</title>
<body>

    <!-- Website Header and Navigation -->
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="products.html">Products</a>
            <a href="faq.html">FAQ</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- Main Website Content -->
    <main>

    <!-- Enquiry Introduction -->
    <section>
        <h1>Make an Enquiry</h1>

        <p>
            Interested in BeeReady or want to know more about the product?
            Complete the form below and BeeReady can get in touch with you.
        </p>
    </section>

    <!-- Enquiry Form -->
    <section>
        <h2>Enquiry Form</h2>

        <form>

            <label for="name">Full Name:</label>
            <br>
            <input type="text" id="name" name="name">
            <br><br>

            <label for="email">Email Address:</label>
            <br>
            <input type="email" id="email" name="email">
            <br><br>

            <label for="phone">Phone Number:</label>
            <br>
            <input type="tel" id="phone" name="phone">
            <br><br>

            <label for="enquiry-type">Enquiry Type:</label>
            <br>
            <select id="enquiry-type" name="enquiry-type">
                <option value="">Please select an option</option>
                <option value="product">Product Information</option>
                <option value="purchase">Where to Purchase</option>
                <option value="general">General Enquiry</option>
            </select>
            <br><br>

            <label for="message">Message:</label>
            <br>
            <textarea id="message" name="message" rows="6" cols="40"></textarea>
            <br><br>

            <button type="submit">Submit Enquiry</button>

        </form>
    </section>

</main>

    <!-- Website Footer -->
    <footer>
        <p>&copy; 2026 BeeReady. All rights reserved.</p>
    </footer>

</body>
</html>
